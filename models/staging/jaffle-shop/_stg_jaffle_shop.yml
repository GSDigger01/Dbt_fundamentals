models:
  - name: stg_jaffle_shop__customers
    description: one unique customer per row
    columns:
      - name: customer_id
        description: primary key of the customer table
        tests:
          - unique
          - not_null      

  - name: stg_jaffle_shop__orders
    description: one order per row
    columns:
      - name: order_id 
        description: primary key of the order table
        tests:
          - unique
          - not_null

      - name: status
        description: "{{ doc('order_status') }}"
        tests:
          - dbt_utils.accepted_values:
              values:
                - completed
                - shipped
                - placed
                - returned
                - return_pending

      - name: customer_id
        tests:
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
